# Dependabot: weekly updates for the GitHub Actions and the npm manifest. The fleet policy is D41 (grouped weekly updates, minor and patch merged after CI)
# and D52 (declined majors as ignore rules), both in the workspace's docs/audit/LENS_GROUNDING_LOG.md. This is a Move package: package.json has no
# dependencies, so the npm entry has little to update; the Move framework comes with the Sui CLI version pinned in move-ci.yml, and the `access_gate`
# dependency is a git commit pinned in Move.toml, which no bot moves.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Few open pull requests at once: the group below normally makes it one a week.
    open-pull-requests-limit: 5
    ignore:
      # TypeScript majors are adopted deliberately, fleet-wide, not by a bot (D52). This package has no TypeScript dependency: the rule is the fleet's template and does nothing here.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # Minor and patch updates arrive as one pull request, merged once CI passes (D41).
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  # Actions are pinned by full commit SHA (D12); one pull request moves every pin together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
